name: lexora
description: Lexora — a personal-reference-book style dictionary app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  translator: ^1.0.4+1
  share_plus: ^13.2.0
  package_info_plus: ^10.2.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F6F5F1"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#F6F5F1"
    theme_color: "#2F6E4F"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/words_en.txt
    - assets/data/ielts_word_bank.json
    - assets/data/ielts_paraphrase_bank.json